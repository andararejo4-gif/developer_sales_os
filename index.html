<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#B45309" />
    <meta name="description" content="Developer Sales OS — PT Andara Rejo Makmur · The Park Townhouse Sukoharjo." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Developer Sales OS</title>
    <script>
      (function () {
        try {
          if (localStorage.getItem('devos_theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
          var CLEAN_KEY = 'devos_sw_clean_20261123_v3';
          if (localStorage.getItem(CLEAN_KEY) !== '1') {
            localStorage.setItem(CLEAN_KEY, '1');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function (names) {
                names.forEach(function (n) { caches.delete(n); });
              });
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-sandstone text-espresso font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
